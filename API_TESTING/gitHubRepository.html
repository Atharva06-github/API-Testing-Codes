<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>GitHub Repository</h1>
        <div>
            <label for="repoName">Repository Name:</label>
            <input type="text" id="repoName" placeholder="Enter your name">
            
            <label for="description">Description: (optional)</label>
            <textarea id="description" placeholder="Enter your message" rows="5"></textarea>
            
            <label for="Visibility">Repo Visibility:</label>
            <select id="Visibility" required>
                <option value="option1">Public</option>
                <option value="option2">Private</option>
            </select>
            
            <button type="submit" onclick=" Repo()">Submit</button>
        </div>
    </div>
</body>
<script src="./repo.js"></script>
</html>
